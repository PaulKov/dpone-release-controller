name: Controller quarantine checks

on:
  pull_request:
  push:
    branches:
      - master

permissions: {}

jobs:
  contract:
    name: Validate quarantine contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout controller source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run dependency-free quarantine checks
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -v
          python3 -B -m py_compile tools/controller_preflight.py tests/*.py
          python3 -m json.tool config/release-controller-activation.json >/dev/null
