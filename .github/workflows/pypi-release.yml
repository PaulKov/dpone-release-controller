name: PyPI release controller

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact dpone version to publish (for example, 0.74.27)
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build exact dpone release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Validate version syntax
        id: identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable dpone release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: PaulKov/dpone
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install locked build runtime
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Verify tag and project identity
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git tag --points-at HEAD)" = "v${VERSION}"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          if project["project"]["name"] != "dpone":
              raise SystemExit("unexpected project name")
          if project["project"]["version"] != os.environ["VERSION"]:
              raise SystemExit("tag and project version differ")
          PY

      - name: Build and validate all release distributions
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist
          uv build
          uv build packages/dpone-native-accel --out-dir dist
          uv build packages/dpone-airflow-pack --out-dir dist
          uv build packages/apache-airflow-providers-dpone --out-dir dist
          uv tool run twine check dist/*
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          filenames = sorted(
              path.name
              for path in Path("dist").iterdir()
              if path.is_file() and path.suffix in {".whl", ".gz"}
          )
          expected = {
              f"{distribution}-{version}{suffix}"
              for distribution in (
                  "dpone",
                  "dpone_native_accel",
                  "dpone_airflow_pack",
                  "apache_airflow_providers_dpone",
              )
              for suffix in (".tar.gz", "-py3-none-any.whl")
          }
          if not filenames:
              raise SystemExit("release build produced no distributions")
          if set(filenames) != expected:
              raise SystemExit(
                  "release distribution inventory differs: "
                  f"expected={sorted(expected)!r} actual={filenames!r}"
              )
          PY

      - name: Upload immutable release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dpone-pypi-${{ steps.identity.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Create immutable PyPI verification manifest
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          project_by_distribution = {
              "dpone": "dpone",
              "dpone_native_accel": "dpone-native-accel",
              "dpone_airflow_pack": "dpone-airflow-pack",
              "apache_airflow_providers_dpone": "apache-airflow-providers-dpone",
          }
          version = os.environ["VERSION"]
          files_by_project = {project: [] for project in project_by_distribution.values()}
          for distribution, project in project_by_distribution.items():
              for suffix in (".tar.gz", "-py3-none-any.whl"):
                  filename = f"{distribution}-{version}{suffix}"
                  path = Path("dist") / filename
                  files_by_project[project].append(
                      {
                          "filename": filename,
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      }
                  )
          Path("release-manifest.json").write_text(
              json.dumps(
                  {
                      "schema": "dpone.pypi-release-manifest.v1",
                      "version": version,
                      "projects": files_by_project,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable PyPI verification manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dpone-pypi-manifest-${{ steps.identity.outputs.version }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  publish:
    name: Publish exact artifacts to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download immutable release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dpone-pypi-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/

  verify-published:
    name: Verify public PyPI files and hashes
    needs:
      - build
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download immutable PyPI verification manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dpone-pypi-manifest-${{ needs.build.outputs.version }}
          path: verification/

      - name: Verify PyPI serves exactly the published archive hashes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          manifest = json.loads(
              (Path("verification") / "release-manifest.json").read_text(encoding="utf-8")
          )
          version = os.environ["VERSION"]
          if manifest.get("schema") != "dpone.pypi-release-manifest.v1":
              raise SystemExit("unexpected PyPI verification manifest schema")
          if manifest.get("version") != version:
              raise SystemExit("PyPI verification manifest version differs")

          expected = {
              project: {entry["filename"]: entry["sha256"] for entry in entries}
              for project, entries in manifest["projects"].items()
          }
          failures = []
          for attempt in range(1, 11):
              failures = []
              for project, expected_files in expected.items():
                  try:
                      with urlopen(
                          f"https://pypi.org/pypi/{project}/{version}/json", timeout=20
                      ) as response:
                          payload = json.load(response)
                  except (HTTPError, URLError, TimeoutError) as error:
                      failures.append(f"{project}: PyPI API unavailable: {error}")
                      continue
                  actual_files = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload.get("urls", [])
                  }
                  if actual_files != expected_files:
                      failures.append(
                          f"{project}: expected={expected_files!r} actual={actual_files!r}"
                      )
              if not failures:
                  break
              if attempt < 10:
                  time.sleep(6)
          if failures:
              raise SystemExit("public PyPI verification failed: " + "; ".join(failures))
          PY
